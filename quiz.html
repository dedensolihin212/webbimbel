<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bermain Kuis Calistung - BintangBelajar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</head>
<body class="bg-gradient-to-b from-amber-50 via-white to-sky-50 min-h-screen flex flex-col font-outfit"
      x-data="{
          lessonId: '',
          quiz: null,
          questions: [],
          currentIdx: 0,
          selectedAnswer: null,
          correctAnswersCount: 0,
          answered: false,
          finished: false,
          loading: true,

          // Canvas Tracing state
          canvas: null,
          ctx: null,
          drawing: false,
          brushColor: '#4f46e5',
          brushSize: 12,

          // Spelling states
          spelledSegments: [], // user clicked letters or syllables

          async init() {
              const params = new URLSearchParams(window.location.search);
              this.lessonId = params.get('lesson_id') || 'l-membaca-1';
              
              setTimeout(async () => {
                  if (!Alpine.store('auth').user) {
                      window.location.href = 'login.html';
                      return;
                  }
                  await this.fetchQuiz();
              }, 400);

              // Watch for changes in current question to speak out loud automatically!
              this.$watch('currentIdx', () => {
                  this.resetInteractiveElements();
                  this.speakCurrentQuestion();
              });
          },

          async fetchQuiz() {
              this.loading = true;
              try {
                  const headers = { 'Authorization': `Bearer ${Alpine.store('auth').token}` };
                  const res = await fetch(`/api/quizzes?lesson_id=${this.lessonId}`, { headers });
                  const data = await res.json();
                  if (data.success) {
                      this.quiz = data.quiz;
                      this.questions = data.quiz.questions;
                  }
              } catch (e) {
                  console.log('Loading local quiz details fallback...');
                  const localQuizzes = JSON.parse(localStorage.getItem('bb_quizzes') || '[]');
                  const foundQuiz = localQuizzes.find(q => q.lesson_id === this.lessonId);
                  
                  if (foundQuiz) {
                      this.quiz = {
                          id: foundQuiz.id,
                          title: foundQuiz.title
                      };
                      this.questions = JSON.parse(foundQuiz.questions_json);
                  } else {
                      // Fallback seed
                      const fallbackDb = {
                          'l-membaca-1': [
                              { type: 'voice_choice', question: 'Manakah di bawah ini yang merupakan huruf vokal A?', options: ['Huruf B', 'Huruf C', 'Huruf A 🌟', 'Huruf D'], answer: 2 },
                              { type: 'voice_choice', question: 'Gambar APEL 🍎 diawali dengan huruf vokal apa?', options: ['Huruf I', 'Huruf E', 'Huruf O', 'Huruf A 🍎'], answer: 3 },
                              { type: 'voice_choice', question: 'Kata IKAN 🐟 memiliki huruf vokal pertama yaitu?', options: ['Huruf I 🐟', 'Huruf U', 'Huruf E', 'Huruf O'], answer: 0 }
                          ],
                          'l-berhitung-1': [
                              { type: 'count', question: 'Ada berapa buah apel merah lezat di dalam keranjang? 🍎', icon: '🍎', count: 3, options: ['2 Apel', '3 Apel 🍎', '4 Apel', '5 Apel'], answer: 1 }
                          ]
                      };
                      const found = fallbackDb[this.lessonId] || fallbackDb['l-membaca-1'];
                      this.quiz = { id: 'q-' + this.lessonId, title: 'Petualangan Bermain Calistung' };
                      this.questions = found;
                  }
              } finally {
                  this.loading = false;
                  this.resetInteractiveElements();
                  this.speakCurrentQuestion();
              }
          },

          speak(text) {
              if ('speechSynthesis' in window) {
                  window.speechSynthesis.cancel();
                  const utterance = new SpeechSynthesisUtterance(text);
                  utterance.lang = 'id-ID';
                  utterance.rate = 0.85;
                  utterance.pitch = 1.3;
                  window.speechSynthesis.speak(utterance);
              }
          },

          speakCurrentQuestion() {
              if (this.questions.length > 0) {
                  const q = this.questions[this.currentIdx];
                  // Let's strip out emojis for clean vocal synthesis
                  const cleanText = q.question.replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDC00-\uDFFF]/g, '');
                  setTimeout(() => {
                      this.speak(cleanText);
                  }, 500);
              }
          },

          resetInteractiveElements() {
              this.spelledSegments = [];
              this.drawing = false;
              
              const currentQ = this.questions[this.currentIdx];
              if (currentQ && currentQ.type === 'trace') {
                  setTimeout(() => {
                      this.initCanvas();
                  }, 300);
              }
          },

          // Canvas Tracing Logic
          initCanvas() {
              const canvasRef = this.$refs.quizCanvas;
              if (!canvasRef) return;
              this.canvas = canvasRef;
              this.ctx = this.canvas.getContext('2d');
              
              // Set appropriate dimensions
              this.canvas.width = this.canvas.parentElement.clientWidth;
              this.canvas.height = 240;
              
              this.ctx.lineCap = 'round';
              this.ctx.lineJoin = 'round';
              this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
          },

          startDraw(e) {
              this.drawing = true;
              this.ctx.beginPath();
              const rect = this.canvas.getBoundingClientRect();
              const x = (e.clientX || e.touches[0].clientX) - rect.left;
              const y = (e.clientY || e.touches[0].clientY) - rect.top;
              this.ctx.moveTo(x, y);
          },

          draw(e) {
              if (!this.drawing) return;
              e.preventDefault();
              const rect = this.canvas.getBoundingClientRect();
              const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
              const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
              
              this.ctx.lineTo(x, y);
              this.ctx.strokeStyle = this.brushColor;
              this.ctx.lineWidth = this.brushSize;
              this.ctx.stroke();
          },

          stopDraw() {
              this.drawing = false;
          },

          clearCanvas() {
              if (this.ctx) {
                  this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                  this.speak('Kanvas bersih!');
              }
          },

          // Syllables Spelling Logic
          clickSpellingOption(seg) {
              if (this.answered) return;
              this.speak(seg);
              this.spelledSegments.push(seg);
              
              const currentQ = this.questions[this.currentIdx];
              const resultWord = this.spelledSegments.join('');
              
              if (resultWord.toUpperCase() === currentQ.word.toUpperCase()) {
                  // Spelled correctly! Trigger answer success.
                  this.submitAnswer(currentQ.answer);
              } else if (resultWord.length >= currentQ.word.length) {
                  // Spelled incorrectly! Reset with a cute vocal warning
                  this.speak('Ups, coba eja sekali lagi ya!');
                  Alpine.store('toast').warning('Coba susun lagi ya...');
                  this.spelledSegments = [];
              }
          },

          submitAnswer(optIdx) {
              if (this.answered) return;
              this.selectedAnswer = optIdx;
              this.answered = true;
              
              const currentQ = this.questions[this.currentIdx];
              
              if (optIdx === currentQ.answer) {
                  this.correctAnswersCount++;
                  this.speak('Hebat! Jawabanmu benar sekali!');
                  Alpine.store('toast').success('Hebat! Kamu Benar! 🎉');
                  window.triggerConfetti();
              } else {
                  this.speak('Salah, coba lagi nanti ya!');
                  Alpine.store('toast').error('Kurang tepat, terus mencoba ya!');
              }
          },

          nextQuestion() {
              this.selectedAnswer = null;
              this.answered = false;
              if (this.currentIdx + 1 < this.questions.length) {
                  this.currentIdx++;
              } else {
                  this.finishQuiz();
              }
          },

          async finishQuiz() {
              this.finished = true;
              const finalScore = Math.round((this.correctAnswersCount / this.questions.length) * 100);
              
              if (finalScore >= 80) {
                  this.speak(`Luar biasa! Kamu mendapatkan nilai ${finalScore} dan mendapat bintang kejutan!`);
                  setTimeout(() => {
                      window.triggerConfetti();
                  }, 200);
              } else {
                  this.speak(`Bagus sekali! Nilai kamu adalah ${finalScore}. Terus berlatih agar mendapat bintang ya!`);
              }
              
              try {
                  const token = Alpine.store('auth').token;
                  await fetch('/api/quizzes', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'Authorization': `Bearer ${token}`
                      },
                      body: JSON.stringify({
                          quiz_id: this.quiz.id,
                          score: finalScore,
                          total_questions: this.questions.length
                      })
                  });
              } catch (e) {
                  console.log('Saved offline score');
              }
          },

          resetQuiz() {
              this.currentIdx = 0;
              this.selectedAnswer = null;
              this.correctAnswersCount = 0;
              this.answered = false;
              this.finished = false;
              this.resetInteractiveElements();
              this.speakCurrentQuestion();
          }
      }">

    <!-- Global Toast Component -->
    <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in $store.toast.list" :key="toast.id">
            <div class="p-4 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-3 pointer-events-auto transition duration-300"
                 :class="{
                    'bg-emerald-50 text-emerald-800 border-emerald-200': toast.type === 'success',
                    'bg-rose-50 text-rose-800 border-rose-200': toast.type === 'error',
                    'bg-sky-50 text-sky-800 border-sky-200': toast.type === 'info',
                    'bg-amber-50 text-amber-800 border-amber-200': toast.type === 'warning'
                 }">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- Sticky Nav -->
    <nav class="bg-white border-b border-amber-100 py-4 px-6 shadow-sm relative z-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center gap-2 text-amber-600 hover:text-amber-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span class="text-sm font-bold">Keluar Main Kuis</span>
            </a>
            
            <div class="flex items-center gap-2">
                <span class="text-2xl animate-bounce-gentle inline-block">👑</span>
                <span class="text-lg font-black text-slate-800 font-outfit" x-text="quiz ? quiz.title : 'Play Arena'"></span>
            </div>
        </div>
    </nav>

    <!-- Play Arena Body -->
    <main class="flex-1 flex items-center justify-center p-6 relative">
        <!-- Background Bubble Accents -->
        <div class="absolute w-[200px] h-[200px] rounded-full bg-pink-100/50 blur-2xl top-10 left-10 pointer-events-none"></div>
        <div class="absolute w-[300px] h-[300px] rounded-full bg-amber-100/40 blur-3xl bottom-10 right-10 pointer-events-none"></div>

        <div x-show="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-amber-500 mx-auto"></div>
            <p class="text-xs text-slate-400 mt-3 font-bold">Menyiapkan Arena Bermain...</p>
        </div>

        <div x-show="!loading" class="w-full max-w-2xl" x-transition>
            <!-- WIZARD IN-PROGRESS CARD -->
            <div x-show="!finished" class="bg-white rounded-[2.5rem] border border-amber-100 shadow-xl overflow-hidden p-6 md:p-10 space-y-6">
                <!-- Progress Header -->
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-black text-slate-400 uppercase tracking-widest" x-text="`Game ${currentIdx + 1} dari ${questions.length}`"></span>
                    </div>
                    
                    <button @click="speakCurrentQuestion()" class="p-2 bg-amber-50 hover:bg-amber-100 text-amber-700 rounded-full transition flex items-center gap-1 text-xs font-bold">
                        <span>🔊 Dikte Suara</span>
                    </button>
                </div>

                <!-- Bubbly progress bar -->
                <div class="w-full h-4 bg-slate-100 rounded-full overflow-hidden p-0.5">
                    <div class="h-full bg-gradient-to-r from-orange-400 to-amber-400 rounded-full transition-all duration-500 shadow-sm"
                         :style="`width: ${((currentIdx + 1) / questions.length) * 100}%`"></div>
                </div>

                <!-- Question Title heading -->
                <div class="text-center space-y-2">
                    <h3 class="text-xl md:text-2xl font-black text-slate-800 leading-relaxed font-outfit" x-text="questions[currentIdx]?.question"></h3>
                </div>

                <!-- ======================================= -->
                <!-- GAMIFIED DYNAMIC QUIZ LAYOUT TEMPLATES -->
                <!-- ======================================= -->

                <!-- 1. TEMPLATE: VOICE_CHOICE (Bubbly Matching) -->
                <template x-if="questions[currentIdx]?.type === 'voice_choice'">
                    <div class="grid grid-cols-2 gap-4 py-4">
                        <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                            <button @click="submitAnswer(idx); speak(opt)"
                                    class="bubble-button p-6 text-center text-xl font-black transition-all flex flex-col items-center justify-center min-h-[120px]"
                                    :class="answered ? (
                                        idx === questions[currentIdx].answer ? 'bg-emerald-100 border-emerald-400 text-emerald-800 animate-pop-bubble' : (
                                            idx === selectedAnswer ? 'bg-rose-100 border-rose-400 text-rose-800' : 'bg-slate-50 border-slate-100 text-slate-300 opacity-60'
                                        )
                                    ) : (
                                        idx === 0 ? 'bg-kids-gradient-yellow text-amber-800 border-amber-300' : (
                                            idx === 1 ? 'bg-kids-gradient-blue text-blue-800 border-blue-300' : (
                                                idx === 2 ? 'bg-kids-gradient-pink text-pink-800 border-pink-300' : 'bg-kids-gradient-green text-emerald-800 border-emerald-300'
                                            )
                                        )
                                    )">
                                <span class="text-2xl" x-text="opt"></span>
                                <span x-show="answered && idx === questions[currentIdx].answer" class="text-xs font-bold text-emerald-700 mt-2">✓ Benar!</span>
                                <span x-show="answered && idx === selectedAnswer && selectedAnswer !== questions[currentIdx].answer" class="text-xs font-bold text-rose-700 mt-2">✗ Coba Lagi</span>
                            </button>
                        </template>
                    </div>
                </template>

                <!-- 2. TEMPLATE: SPELL (Syllables matching bubbles) -->
                <template x-if="questions[currentIdx]?.type === 'spell' || questions[currentIdx]?.type === 'spell_letters'">
                    <div class="space-y-6 py-2 text-center">
                        <!-- Spelled word result boxes -->
                        <div class="flex justify-center gap-3 min-h-[60px] p-4 bg-slate-50 border-2 border-dashed border-amber-200 rounded-3xl items-center">
                            <template x-for="seg in spelledSegments">
                                <span class="px-5 py-2.5 bg-gradient-to-tr from-amber-400 to-orange-500 text-white rounded-2xl text-xl font-black shadow-md animate-pop-bubble" x-text="seg"></span>
                            </template>
                            <span x-show="spelledSegments.length === 0" class="text-xs text-slate-400 font-bold">Tekan gelembung suku kata di bawah sesuai urutan!</span>
                        </div>

                        <!-- Jumbled options selection -->
                        <div class="flex justify-center gap-4 flex-wrap">
                            <template x-for="seg in questions[currentIdx]?.jumbled" :key="seg">
                                <button @click="clickSpellingOption(seg)"
                                        :disabled="answered"
                                        class="px-6 py-4 bg-white hover:bg-amber-50 border-4 border-amber-200 hover:border-amber-400 text-slate-800 text-xl font-black rounded-3xl shadow-md transition transform active:scale-95 disabled:opacity-50"
                                        x-text="seg"></button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 3. TEMPLATE: TRACE (Canvas Whiteboard Tracing) -->
                <template x-if="questions[currentIdx]?.type === 'trace'">
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-400 font-bold">Silakan lukis langsung di papan digital!</span>
                            <button @click="clearCanvas()" class="px-4 py-1.5 bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold text-xs rounded-xl transition">
                                Hapus Papan
                            </button>
                        </div>

                        <!-- Tracing container box -->
                        <div class="border-4 border-dashed border-indigo-200 rounded-3xl overflow-hidden bg-slate-50 relative">
                            <!-- Watermark guide shape -->
                            <div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none opacity-[0.07]">
                                <span class="text-[11rem] font-black text-indigo-950 font-outfit" x-text="questions[currentIdx]?.watermark"></span>
                            </div>
                            
                            <canvas x-ref="quizCanvas" 
                                    @mousedown="startDraw($event)" @mousemove="draw($event)" @mouseup="stopDraw()" @mouseleave="stopDraw()"
                                    @touchstart="startDraw($event)" @touchmove="draw($event)" @touchend="stopDraw()"
                                    class="drawing-canvas w-full h-[240px]"></canvas>
                        </div>

                        <!-- Brushes Color palette control -->
                        <div class="flex items-center justify-between gap-4 pt-1">
                            <span class="text-xs text-slate-400 font-bold">WARNA LUKISAN:</span>
                            <div class="flex items-center gap-2">
                                <template x-for="color in ['#4f46e5', '#ec4899', '#10b981', '#f59e0b', '#000000']">
                                    <button @click="brushColor = color; speak('Ganti warna')"
                                            class="w-7 h-7 rounded-full border-2 transition transform hover:scale-110"
                                            :style="`background-color: ${color}`"
                                            :class="brushColor === color ? 'border-indigo-600 scale-110' : 'border-white'"></button>
                                </template>
                            </div>
                        </div>

                        <!-- Tracing matching option submit -->
                        <div class="pt-2">
                            <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                                <button @click="submitAnswer(idx)"
                                        class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl text-md font-black shadow-lg transition"
                                        x-text="opt"></button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 4. TEMPLATE: COUNT (Bouncy Apples Counting) -->
                <template x-if="questions[currentIdx]?.type === 'count'">
                    <div class="space-y-6">
                        <!-- Keranjang buah visual -->
                        <div class="bg-gradient-to-b from-amber-50 to-amber-100/50 p-6 rounded-3xl border-2 border-dashed border-amber-200 flex flex-wrap items-center justify-center gap-4 min-h-[120px]">
                            <template x-for="n in questions[currentIdx]?.count">
                                <span class="text-5xl animate-bounce-gentle inline-block" x-text="questions[currentIdx]?.icon"></span>
                            </template>
                        </div>

                        <!-- Bubbly counting options -->
                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                                <button @click="submitAnswer(idx)"
                                        class="bubble-button py-4 text-center text-lg font-black transition-all"
                                        :class="answered ? (
                                            idx === questions[currentIdx].answer ? 'bg-emerald-500 border-emerald-600 text-white shadow-lg' : (
                                                idx === selectedAnswer ? 'bg-rose-500 border-rose-600 text-white shadow-lg' : 'bg-slate-50 border-slate-100 text-slate-300 opacity-60'
                                            )
                                        ) : 'bg-white hover:bg-amber-50 border-slate-200 text-slate-800'"
                                        x-text="opt"></button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 5. TEMPLATE: SUM (Fruit Addition equation) -->
                <template x-if="questions[currentIdx]?.type === 'sum'">
                    <div class="space-y-6">
                        <!-- Addition Visual representation -->
                        <div class="flex items-center justify-center gap-4 bg-gradient-to-r from-emerald-50 to-sky-50 p-6 rounded-3xl border border-emerald-100">
                            <!-- Left items block -->
                            <div class="flex flex-wrap max-w-[150px] justify-center gap-1.5 p-3 bg-white rounded-2xl shadow-sm">
                                <template x-for="n in questions[currentIdx]?.left_count">
                                    <span class="text-3xl animate-bounce-gentle inline-block" x-text="questions[currentIdx]?.left_icon"></span>
                                </template>
                            </div>
                            
                            <!-- Plus Sign symbol -->
                            <span class="text-3xl font-black text-indigo-600 font-outfit">+</span>
                            
                            <!-- Right items block -->
                            <div class="flex flex-wrap max-w-[150px] justify-center gap-1.5 p-3 bg-white rounded-2xl shadow-sm">
                                <template x-for="n in questions[currentIdx]?.right_count">
                                    <span class="text-3xl animate-bounce-gentle inline-block" x-text="questions[currentIdx]?.right_icon"></span>
                                </template>
                            </div>
                        </div>

                        <!-- Addition options -->
                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                                <button @click="submitAnswer(idx)"
                                        class="bubble-button py-4 text-center text-lg font-black transition-all"
                                        :class="answered ? (
                                            idx === questions[currentIdx].answer ? 'bg-emerald-500 border-emerald-600 text-white shadow-lg' : (
                                                idx === selectedAnswer ? 'bg-rose-50 border-rose-600 text-white shadow-lg' : 'bg-slate-50 border-slate-100 text-slate-300 opacity-60'
                                            )
                                        ) : 'bg-white hover:bg-emerald-50 border-slate-200 text-slate-800'"
                                        x-text="opt"></button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 6. TEMPLATE: SCALE (Visual Balance scale puzzle) -->
                <template x-if="questions[currentIdx]?.type === 'scale'">
                    <div class="space-y-6">
                        <!-- Timbangan Visual -->
                        <div class="bg-gradient-to-r from-orange-50 to-amber-50 p-6 rounded-3xl border border-amber-100 flex flex-col items-center justify-center space-y-4">
                            <div class="flex items-end justify-between w-full max-w-[400px]">
                                <!-- Left Pan -->
                                <div class="flex flex-col items-center space-y-1 w-1/3">
                                    <div class="flex flex-wrap justify-center gap-1.5 p-3 bg-white rounded-2xl shadow-sm min-h-[70px] items-center">
                                        <template x-for="n in questions[currentIdx]?.left_count">
                                            <span class="text-3xl animate-bounce-gentle inline-block" x-text="questions[currentIdx]?.left_icon"></span>
                                        </template>
                                    </div>
                                    <span class="text-xs font-bold text-slate-500">Piring Kiri</span>
                                </div>
                                
                                <!-- Balance Scale Center Stand -->
                                <div class="w-1/3 flex flex-col items-center">
                                    <span class="text-5xl animate-bounce-gentle">⚖️</span>
                                    <span class="text-[10px] font-bold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full mt-2">SEIMBANG</span>
                                </div>

                                <!-- Right Pan -->
                                <div class="flex flex-col items-center space-y-1 w-1/3">
                                    <div class="flex flex-wrap justify-center gap-1.5 p-3 bg-white rounded-2xl shadow-sm min-h-[70px] items-center">
                                        <template x-for="n in questions[currentIdx]?.right_count">
                                            <span class="text-3xl animate-bounce-gentle inline-block" x-text="questions[currentIdx]?.right_icon"></span>
                                        </template>
                                    </div>
                                    <span class="text-xs font-bold text-slate-500">Piring Kanan</span>
                                </div>
                            </div>
                        </div>

                        <!-- Scale options selection -->
                        <div class="grid grid-cols-2 gap-3">
                            <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                                <button @click="submitAnswer(idx)"
                                        class="bubble-button py-4 text-center text-lg font-black transition-all"
                                        :class="answered ? (
                                            idx === questions[currentIdx].answer ? 'bg-emerald-500 border-emerald-600 text-white shadow-lg' : (
                                                idx === selectedAnswer ? 'bg-rose-50 border-rose-600 text-white shadow-lg' : 'bg-slate-50 border-slate-100 text-slate-300 opacity-60'
                                            )
                                        ) : 'bg-white hover:bg-emerald-50 border-slate-200 text-slate-800'"
                                        x-text="opt"></button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- ======================================= -->

                <!-- Navigation Action Button next -->
                <div x-show="answered" class="pt-4 flex justify-end">
                    <button @click="nextQuestion()"
                            class="px-6 py-4 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl shadow-md shadow-amber-200 text-sm transition flex items-center gap-1.5 transform hover:scale-102">
                        <span x-text="currentIdx + 1 === questions.length ? 'Lihat Hasil Bintang 👑' : 'Lanjut Bermain 🚀'"></span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- EXAM COMPLETE SCREEN -->
            <div x-show="finished" class="bg-white rounded-[2.5rem] border border-amber-100 shadow-xl overflow-hidden p-10 text-center space-y-6" x-transition>
                <span class="text-7xl animate-bounce-gentle inline-block" x-text="Math.round((correctAnswersCount / questions.length) * 100) >= 80 ? '👑' : '💪'"></span>
                
                <div class="space-y-2">
                    <h3 class="text-3xl font-black text-slate-800 font-outfit">Petualangan Selesai!</h3>
                    <p class="text-sm text-slate-500 max-w-sm mx-auto">Selamat! Kamu sudah menyelesaikan seluruh rangkaian tantangan bermain hari ini dengan sangat hebat!</p>
                </div>

                <!-- Big Grade layout -->
                <div class="w-40 h-40 bg-gradient-to-tr from-amber-400 via-orange-500 to-pink-500 rounded-full flex flex-col items-center justify-center text-white mx-auto shadow-xl shadow-amber-200 relative">
                    <div class="absolute inset-2 border-4 border-dashed border-white/30 rounded-full"></div>
                    <p class="text-xs uppercase font-black tracking-widest text-amber-100">Bintang</p>
                    <p class="text-5xl font-black font-outfit mt-1 animate-bounce-gentle" x-text="`${correctAnswersCount * 10}`"></p>
                </div>

                <p class="text-md font-black text-slate-700" x-text="`Kamu Menjawab Benar ${correctAnswersCount} dari ${questions.length} Tantangan`"></p>

                <!-- Actions buttons -->
                <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
                    <button @click="resetQuiz()"
                            class="px-8 py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-sm transition">
                        Bermain Lagi 🔄
                    </button>
                    <a href="dashboard.html"
                       class="px-8 py-4 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl text-sm shadow-lg shadow-amber-200 transition">
                        Ke Dashboard 🏠
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
