<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uji Kemampuan - BintangBelajar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col"
      x-data="{
          lessonId: '',
          quiz: null,
          questions: [],
          currentIdx: 0,
          selectedAnswer: null,
          correctAnswersCount: 0,
          answered: false,
          finished: false,
          loading: true,

          async init() {
              const params = new URLSearchParams(window.location.search);
              this.lessonId = params.get('lesson_id') || 'l-sd-1';
              
              setTimeout(async () => {
                  if (!Alpine.store('auth').user) {
                      window.location.href = 'login.html';
                      return;
                  }
                  await this.fetchQuiz();
              }, 400);
          },

          async fetchQuiz() {
              this.loading = true;
              try {
                  const headers = { 'Authorization': `Bearer ${Alpine.store('auth').token}` };
                  const res = await fetch(`/api/quizzes?lesson_id=${this.lessonId}`, { headers });
                  const data = await res.json();
                  if (data.success) {
                      this.quiz = data.quiz;
                      this.questions = data.quiz.questions;
                  }
              } catch (e) {
                  // Fallbacks simulation
                  console.log('Loading local quiz details fallback...');
                  const localQuizzes = JSON.parse(localStorage.getItem('bb_quizzes') || '[]');
                  const foundQuiz = localQuizzes.find(q => q.lesson_id === this.lessonId);
                  
                  if (foundQuiz) {
                      this.quiz = {
                          id: foundQuiz.id,
                          title: foundQuiz.title
                      };
                      this.questions = JSON.parse(foundQuiz.questions_json);
                  } else {
                      const fallbacks = {
                          'l-cal-1': {
                              id: 'q-cal-1',
                              title: 'Kuis Seru Huruf Vokal',
                              questions: [
                                  { question: 'Manakah di bawah ini yang merupakan huruf vokal?', options: ['B', 'C', 'A', 'D'], answer: 2 },
                                  { question: 'Hewan APEL diawali dengan huruf vokal apa?', options: ['I', 'E', 'O', 'A'], answer: 3 }
                              ]
                          },
                          'l-sd-1': {
                              id: 'q-sd-1',
                              title: 'Uji Pemahaman Pecahan',
                              questions: [
                                  { question: 'Jika sebuah lingkaran dibagi menjadi 4 bagian sama besar, dan 1 bagian diarsir, berapa pecahannya?', options: ['1/2', '1/4', '3/4', '4/1'], answer: 1 },
                                  { question: 'Pecahan 2/4 senilai dengan pecahan...', options: ['1/2', '1/3', '3/4', '2/5'], answer: 0 }
                              ]
                          },
                          'l-mat-1': {
                              id: 'q-mat-1',
                              title: 'Kuis Aljabar Kilat',
                              questions: [
                                  { question: 'Jika 3x + 5 = 20, berapakah nilai x?', options: ['3', '4', '5', '6'], answer: 2 },
                                  { question: 'Jika x + y = 10 dan x - y = 2, berapakah nilai x?', options: ['4', '5', '6', '8'], answer: 2 }
                              ]
                          },
                          'l-smp-1': {
                              id: 'q-smp-1',
                              title: 'Kuis Tata Surya Terluas',
                              questions: [
                                  { question: 'Manakah planet terbesar dalam tata surya kita?', options: ['Bumi', 'Mars', 'Jupiter', 'Saturnus'], answer: 2 },
                                  { question: 'Planet yang dijuluki sebagai Planet Merah adalah...', options: ['Venus', 'Mars', 'Merkurius', 'Neptunus'], answer: 1 }
                              ]
                          }
                      };
                      const current = fallbacks[this.lessonId] || fallbacks['l-sd-1'];
                      this.quiz = current;
                      this.questions = current.questions;
                  }
              } finally {
                  this.loading = false;
              }
          },

          submitAnswer(optIdx) {
              if (this.answered) return;
              this.selectedAnswer = optIdx;
              this.answered = true;
              
              if (optIdx === this.questions[this.currentIdx].answer) {
                  this.correctAnswersCount++;
                  Alpine.store('toast').success('Jawabanmu BENAR! +10 Bintang 🌟');
              } else {
                  Alpine.store('toast').error('Ups! Jawaban kurang tepat. Coba lagi nanti ya.');
              }
          },

          nextQuestion() {
              this.selectedAnswer = null;
              this.answered = false;
              if (this.currentIdx + 1 < this.questions.length) {
                  this.currentIdx++;
              } else {
                  this.finishQuiz();
              }
          },

          async finishQuiz() {
              this.finished = true;
              const finalScore = Math.round((this.correctAnswersCount / this.questions.length) * 100);
              
              if (finalScore >= 80) {
                  setTimeout(() => {
                      window.triggerConfetti();
                  }, 200);
              }
              
              try {
                  const token = Alpine.store('auth').token;
                  await fetch('/api/quizzes', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'Authorization': `Bearer ${token}`
                      },
                      body: JSON.stringify({
                          quiz_id: this.quiz.id,
                          score: finalScore,
                          total_questions: this.questions.length
                      })
                  });
              } catch (e) {
                  console.log('Saved offline score simulator');
              }
          },

          resetQuiz() {
              this.currentIdx = 0;
              this.selectedAnswer = null;
              this.correctAnswersCount = 0;
              this.answered = false;
              this.finished = false;
          }
      }">

    <!-- Global Toast Component -->
    <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in $store.toast.list" :key="toast.id">
            <div class="p-4 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-3 pointer-events-auto transition duration-300"
                 :class="{
                    'bg-emerald-50 text-emerald-800 border-emerald-200': toast.type === 'success',
                    'bg-rose-50 text-rose-800 border-rose-200': toast.type === 'error',
                    'bg-sky-50 text-sky-800 border-sky-200': toast.type === 'info',
                    'bg-amber-50 text-amber-800 border-amber-200': toast.type === 'warning'
                 }">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- Sticky Nav -->
    <nav class="bg-white border-b border-slate-100 py-4 px-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="dashboard.html" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span class="text-sm font-bold">Keluar Kuis</span>
            </a>
            <span class="text-sm font-bold text-slate-800 font-outfit" x-text="quiz ? quiz.title : 'Kuis Evaluasi'"></span>
        </div>
    </nav>

    <!-- Quiz Panel Body -->
    <main class="flex-1 flex items-center justify-center p-6">
        <div x-show="loading" class="text-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto"></div>
            <p class="text-xs text-slate-400 mt-3 font-semibold">Menyiapkan kuis...</p>
        </div>

        <div x-show="!loading" class="w-full max-w-xl" x-transition>
            <!-- WIZARD IN-PROGRESS CARD -->
            <div x-show="!finished" class="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden p-8 md:p-10 space-y-6">
                <!-- Top wizard index -->
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-widest" x-text="`Soal ${currentIdx + 1} dari ${questions.length}`"></span>
                    
                    <!-- Scoring status -->
                    <span class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full" x-text="`Skor Sementara: ${correctAnswersCount * 10}`"></span>
                </div>

                <!-- Progress percentage bar -->
                <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-indigo-500 to-pink-500 transition-all duration-300"
                         :style="`width: ${((currentIdx + 1) / questions.length) * 100}%`"></div>
                </div>

                <!-- Question heading -->
                <h3 class="text-xl font-bold font-outfit text-slate-800 leading-relaxed pt-2" x-text="questions[currentIdx]?.question"></h3>

                <!-- Options lists -->
                <div class="space-y-3 pt-2">
                    <template x-for="(opt, idx) in questions[currentIdx]?.options" :key="idx">
                        <button @click="submitAnswer(idx)"
                                class="w-full p-4.5 text-left rounded-2xl border text-sm font-semibold transition-all flex items-center justify-between"
                                :class="answered ? (
                                    idx === questions[currentIdx].answer ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : (
                                        idx === selectedAnswer ? 'bg-rose-50 border-rose-300 text-rose-800' : 'bg-slate-50 border-slate-100 text-slate-400 opacity-60'
                                    )
                                ) : 'bg-white hover:bg-slate-50 border-slate-200 text-slate-700'">
                            <span x-text="opt"></span>
                            
                            <!-- State Indicator icon -->
                            <span x-show="answered && idx === questions[currentIdx].answer" class="text-emerald-600 font-bold">✓ Benar</span>
                            <span x-show="answered && idx === selectedAnswer && selectedAnswer !== questions[currentIdx].answer" class="text-rose-600 font-bold">✗ Salah</span>
                        </button>
                    </template>
                </div>

                <!-- Action Button next -->
                <div x-show="answered" class="pt-4 flex justify-end">
                    <button @click="nextQuestion()"
                            class="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md shadow-indigo-100 text-xs transition flex items-center gap-1.5">
                        <span x-text="currentIdx + 1 === questions.length ? 'Lihat Hasil Akhir' : 'Soal Berikutnya'"></span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>

            <!-- EXAM COMPLETE SCREEN -->
            <div x-show="finished" class="bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden p-10 text-center space-y-6" x-transition>
                <span class="text-7xl animate-bounce-gentle inline-block" x-text="Math.round((correctAnswersCount / questions.length) * 100) >= 80 ? '🎉' : '💪'"></span>
                
                <div class="space-y-2">
                    <h3 class="text-2xl font-extrabold font-outfit text-slate-800">Uji Evaluasi Selesai!</h3>
                    <p class="text-xs text-slate-500 max-w-sm mx-auto">Selamat! Kamu sudah menyelesaikan seluruh rangkaian soal evaluasi hari ini dengan luar biasa.</p>
                </div>

                <!-- Big Grade layout -->
                <div class="w-36 h-36 bg-gradient-to-tr from-indigo-500 to-pink-500 rounded-full flex flex-col items-center justify-center text-white mx-auto shadow-xl shadow-indigo-200">
                    <p class="text-[10px] uppercase font-bold tracking-widest text-indigo-100">Skor Kamu</p>
                    <p class="text-4xl font-black font-outfit mt-1" x-text="`${Math.round((correctAnswersCount / questions.length) * 100)}`"></p>
                </div>

                <p class="text-xs font-bold text-slate-700" x-text="`Benar ${correctAnswersCount} dari ${questions.length} Soal`"></p>

                <!-- Actions buttons -->
                <div class="flex flex-wrap items-center justify-center gap-4 pt-4">
                    <button @click="resetQuiz()"
                            class="px-6 py-3.5 bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold rounded-2xl text-xs transition">
                        Ulangi Kuis
                    </button>
                    <a href="dashboard.html"
                       class="px-7 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-xs shadow-md shadow-indigo-100 transition">
                        Selesai & Ke Dashboard
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
