<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar - BintangBelajar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Alpine.js Core -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- Custom JS -->
    <script src="assets/js/main.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center py-12 px-6 relative overflow-hidden" 
      x-data="{ 
          activeTab: 'login',
          loginEmail: 'budi@gmail.com', 
          loginPassword: 'budi123',
          regName: '', 
          regEmail: '', 
          regPassword: '', 
          regGrade: 'SD',
          loading: false,
          errorMsg: '',

          init() {
              // Parse URL for custom tab loading
              const params = new URLSearchParams(window.location.search);
              if (params.get('tab') === 'register') {
                  this.activeTab = 'register';
              }
              // Redirect if already logged in
              setTimeout(() => {
                  if (Alpine.store('auth').user) {
                      window.location.href = 'dashboard.html';
                  }
              }, 300);
          },

          async handleLogin() {
              this.loading = true;
              this.errorMsg = '';
              const res = await Alpine.store('auth').login(this.loginEmail, this.loginPassword);
              this.loading = false;
              if (res.success) {
                  window.location.href = 'dashboard.html';
              } else {
                  this.errorMsg = res.message;
              }
          },

          async handleRegister() {
              if (!this.regName || !this.regEmail || !this.regPassword) {
                  this.errorMsg = 'Silakan lengkapi semua kolom pendaftaran.';
                  return;
              }
              this.loading = true;
              this.errorMsg = '';
              const res = await Alpine.store('auth').register(
                  this.regName, this.regEmail, this.regPassword, this.regGrade
              );
              this.loading = false;
              if (res.success) {
                  window.location.href = 'dashboard.html';
              } else {
                  this.errorMsg = res.message;
              }
          }
      }">

    <!-- Floating bubbles background -->
    <div class="absolute w-[400px] h-[400px] bg-indigo-300/30 rounded-full blur-3xl -top-20 -left-20 animate-float"></div>
    <div class="absolute w-[400px] h-[400px] bg-pink-300/20 rounded-full blur-3xl -bottom-20 -right-20 animate-bounce-gentle"></div>

    <!-- Global Toast Component -->
    <div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
        <template x-for="toast in $store.toast.list" :key="toast.id">
            <div class="p-4 rounded-xl shadow-lg border text-sm font-medium flex items-center gap-3 pointer-events-auto transition duration-300"
                 :class="{
                    'bg-emerald-50 text-emerald-800 border-emerald-200': toast.type === 'success',
                    'bg-rose-50 text-rose-800 border-rose-200': toast.type === 'error',
                    'bg-sky-50 text-sky-800 border-sky-200': toast.type === 'info',
                    'bg-amber-50 text-amber-800 border-amber-200': toast.type === 'warning'
                 }">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- Card Wrapper -->
    <div class="w-full max-w-md glass-panel rounded-[2.5rem] shadow-2xl p-8 md:p-10 relative z-10 border border-white/50">
        
        <!-- Header logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center text-white text-base">⭐</div>
                <span class="text-2xl font-extrabold font-outfit bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent">BintangBelajar</span>
            </a>
            <p class="text-xs text-slate-500 mt-1">Belajar Asyik, Berprestasi Cepat!</p>
        </div>

        <!-- Tab switches -->
        <div class="grid grid-cols-2 bg-slate-200/50 p-1 rounded-2xl mb-6">
            <button @click="activeTab = 'login'; errorMsg = ''" 
                    class="py-2.5 rounded-xl text-sm font-bold transition-all"
                    :class="activeTab === 'login' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                Masuk
            </button>
            <button @click="activeTab = 'register'; errorMsg = ''" 
                    class="py-2.5 rounded-xl text-sm font-bold transition-all"
                    :class="activeTab === 'register' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'">
                Daftar Baru
            </button>
        </div>

        <!-- Error panel -->
        <div x-show="errorMsg" x-transition class="mb-4 p-3.5 bg-rose-50 border border-rose-200 rounded-2xl text-xs font-semibold text-rose-700 flex items-start gap-2.5">
            <span class="mt-0.5">⚠️</span>
            <span x-text="errorMsg"></span>
        </div>

        <!-- Form 1: LOGIN -->
        <form x-show="activeTab === 'login'" @submit.prevent="handleLogin()" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Siswa / Wali</label>
                <input type="email" x-model="loginEmail" required
                       class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800"
                       placeholder="nama@email.com">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Kata Sandi</label>
                <input type="password" x-model="loginPassword" required
                       class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800"
                       placeholder="••••••••">
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:opacity-95 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 flex items-center justify-center gap-2 transition disabled:opacity-50">
                <span x-show="loading" class="animate-spin text-white">&#9696;</span>
                <span>Masuk Sekarang</span>
            </button>
            
            <div class="text-center pt-2">
                <span class="text-xs text-slate-400">Demo? Masuk dengan: budi@gmail.com / budi123</span>
            </div>
        </form>

        <!-- Form 2: REGISTER -->
        <form x-show="activeTab === 'register'" @submit.prevent="handleRegister()" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nama Lengkap Siswa</label>
                <input type="text" x-model="regName" required
                       class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800"
                       placeholder="Ananda Bintang">
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Aktif</label>
                <input type="email" x-model="regEmail" required
                       class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800"
                       placeholder="nama@email.com">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Kata Sandi</label>
                    <input type="password" x-model="regPassword" required
                           class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800"
                           placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Jenjang Sekolah</label>
                    <select x-model="regGrade"
                            class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 bg-white/60 focus:border-indigo-500 focus:bg-white focus:ring-1 focus:ring-indigo-500 transition-all outline-none text-sm text-slate-800">
                        <option value="TK">TK (Calistung)</option>
                        <option value="SD">SD (Semua Mapel)</option>
                        <option value="SMP">SMP (IPA & Matematika)</option>
                    </select>
                </div>
            </div>

            <button type="submit" :disabled="loading"
                    class="w-full py-4 bg-gradient-to-r from-pink-500 to-violet-600 hover:opacity-95 text-white font-bold rounded-2xl shadow-lg shadow-pink-100 flex items-center justify-center gap-2 transition disabled:opacity-50">
                <span x-show="loading" class="animate-spin text-white">&#9696;</span>
                <span>Buat Akun Gratis</span>
            </button>
        </form>
    </div>
</body>
</html>
